# hplip.conf.  Generated from hplip.conf.in by configure.

[hplip]
version=3.26.6

[dirs]
home=/usr/share/hplip
run=/var/run
ppd=/usr/share/ppd/HP
ppdbase=/usr/share/ppd
doc=/usr/share/doc/hplip-3.26.6
html=/usr/share/doc/hplip-3.26.6
icon=/usr/share/applications
cupsbackend=/usr/lib/cups/backend
cupsfilter=/usr/lib/cups/filter
drv=/usr/share/cups/drv/hp
bin=/usr/bin
apparmor=/etc/apparmor.d

[plugin]
# Allowed library directories for plugin installation. Colon-separated.
# Used by installer/pluginhandler.py to validate plugin destination paths.
allowed_lib_dirs=/usr/lib:/usr/lib64:/usr/local/lib:/usr/local/lib64:/usr/lib/x86_64-linux-gnu:/usr/lib/i386-linux-gnu:/usr/lib/aarch64-linux-gnu:/usr/lib/arm-linux-gnueabihf
# Allowed SANE library directories for plugin installation. Colon-separated.
allowed_sane_dirs=/usr/lib/sane:/usr/lib64/sane:/usr/local/lib/sane:/usr/local/lib64/sane:/usr/lib/x86_64-linux-gnu/sane:/usr/lib/i386-linux-gnu/sane:/usr/lib/aarch64-linux-gnu/sane:/usr/lib/arm-linux-gnueabihf/sane
# Following values are determined at configure time and cannot be changed.
[configure]
network-build=yes
libusb01-build=no
pp-build=no
gui-build=yes
scanner-build=yes
fax-build=yes
dbus-build=yes
cups11-build=no
doc-build=yes
shadow-build=no
hpijs-install=no
foomatic-drv-install=no
foomatic-ppd-install=no
foomatic-rip-hplip-install=no
hpcups-install=yes
cups-drv-install=yes
cups-ppd-install=no
internal-tag=3.26.6
restricted-build=no
ui-toolkit=qt5
qt3=no
qt4=no
qt5=yes
policy-kit=@policykit@
lite-build=no
udev_sysfs_rules=no
hpcups-only-build=no
hpijs-only-build=no
apparmor_build=yes
class-driver=no
